plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minasar.zakerm'
    compileSdk 34

    defaultConfig {
        applicationId "com.minasar.zakerm"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resValue "string", "appName", "Zaker-m"
        resValue "string", "hostName", "minasar326-rgb.github.io"
        resValue "string", "defaultUrl", "https://minasar326-rgb.github.io/Zaker-m/"
        resValue "string", "assetStatements", """
            [{
                "relation": ["delegate_permission/common.handle_all_urls"],
                "target": {
                    "namespace": "android_app",
                    "package_name": "com.minasar.zakerm",
                    "sha256_cert_fingerprints": ["30:7D:F8:78:33:9A:C3:63:73:C0:7E:DC:02:69:B6:54:33:2E:2D:E8:13:B9:AA:A0:8A:DF:42:04:1E:51:75:E7"]
                }
            }]
        """
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "zakerm2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "zakerm"
            keyPassword System.getenv("KEY_PASSWORD") ?: "zakerm2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
