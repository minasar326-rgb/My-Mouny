<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ذاكر - وضع عدم الاتصال (أوفلاين)</title>
  <link rel="icon" type="image/png" href="/Zaker-MB/favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
    }
    .icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(2, 132, 199, 0.4);
      color: #38bdf8;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }
    .security-note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <img src="/Zaker-MB/icons/icon-192.png" alt="ذاكر">
    </div>
    <div class="badge">
      <span>●</span> وضع الأوفلاين نشط (محفوظ محلياً)
    </div>
    <h1>ذاكر - المحفظة والخزنة المالية</h1>
    <p>
      أنت الآن تعمل بدون اتصال بالإنترنت. تطبيق ذاكر مصمم بتقنية <strong>Offline-First</strong>، فجميع بياناتك ومصاريفك وحساباتك محفوظة ومشفرة محلياً على هاتفك.
    </p>
    <div class="btn-group">
      <a href="/Zaker-MB/" class="btn-primary">فتح الخزنة الرئيسية</a>
      <button onclick="location.reload()" class="btn-secondary">إعادة محاولة الاتصال</button>
    </div>
    <div class="security-note">
      تشفير محلي عسكري قياسي AES-256 · لا خوادم خارجية
    </div>
  </div>
</body>
</html>
