name: Build Android App (Google Play AAB & APK)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release (AAB & APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Release Keystore
        run: |
          mkdir -p android/app
          rm -f android/app/release.keystore
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias zakerm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zakerm2026 \
            -keypass zakerm2026 \
            -dname "CN=my-mouny, OU=Mobile, O=my-mouny, L=Cairo, ST=Cairo, C=EG"
          keytool -list -v -keystore android/app/release.keystore -alias zakerm -storepass zakerm2026

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build Android Bundle (AAB) & APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: zakerm2026
          KEY_ALIAS: zakerm
          KEY_PASSWORD: zakerm2026
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace --no-daemon
          echo "### Gradle Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Output files:" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -type f >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Android App Bundle (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: my-Mouny-GooglePlay-AAB
          path: android/app/build/outputs/**/*.aab

      - name: Upload Release APK (For Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: my-Mouny-Release-APK
          path: android/app/build/outputs/**/*.apk

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: my-Mouny-Signing-Keystore
          path: android/app/release.keystore

      - name: Create GitHub Release with Downloads
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          name: "my Mouny Android Release (Google Play AAB & APK)"
          tag_name: "v1.0.4"
          draft: false
          prerelease: false
          body: |
            ### 📱 تطبيق my Mouny للأندرويد ومتجر جوجل بلاي

            - **حزمة النشر على Google Play Console:** `app-release.aab` (Android App Bundle)
            - **ملف التثبيت المباشر على الهاتف:** `app-release.apk`
            - **شهادة التوقيع الرقمية:** `release.keystore`
              - **Alias:** `zakerm`
              - **Password:** `zakerm2026`
              - **Target SDK:** `34` (Android 14 - متوافق مع كافة متطلبات جوجل بلاي 2026)
              - **Application ID:** `com.minasar.zakerm`
          files: |
            android/app/build/outputs/**/*.aab
            android/app/build/outputs/**/*.apk
            android/app/release.keystore
