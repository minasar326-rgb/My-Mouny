name: Build Android App (Google Play AAB & APK)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release (AAB & APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Release Keystore
        run: |
          mkdir -p android/app
          rm -f android/app/release.keystore
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias zakerm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass zakerm2026 \
            -keypass zakerm2026 \
            -dname "CN=Zaker, OU=Mobile, O=Zaker, L=Cairo, ST=Cairo, C=EG"
          keytool -list -v -keystore android/app/release.keystore -alias zakerm -storepass zakerm2026

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Bundle (AAB) & APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: zakerm2026
          KEY_ALIAS: zakerm
          KEY_PASSWORD: zakerm2026
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log || (cat build.log >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Upload Android App Bundle (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: My-Mouny-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK (For Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: My-Mouny-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: My-Mouny-Signing-Keystore
          path: android/app/release.keystore

      - name: Create GitHub Release with Downloads
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "My-Mouny Android Release"
          draft: false
          prerelease: false
          body: |
            ### 📱 تطبيق My Mouny للأندرويد ومتجر جوجل بلاي

            - **ملف النشر على Google Play Console:** `app-release.aab` (Android App Bundle)
            - **ملف التثبيت المباشر على الهاتف:** `app-release.apk`
            - **شهادة التوقيع الرقمية:** `release.keystore`
              - **Alias:** `zakerm`
              - **Password:** `zakerm2026`
              - **SHA-256 Fingerprint:** `D0:68:7E:C5:02:0B:74:DE:19:56:9A:86:54:EC:65:8A:A0:77:D1:22:3A:B3:0A:36:24:7A:62:1C:D2:35:C1:13`
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/release.keystore
