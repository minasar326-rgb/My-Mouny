name: Build Android App (Google Play AAB & APK)

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release (AAB & APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Production Keystore
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias zakerm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass zakerm2026 \
              -keypass zakerm2026 \
              -dname "CN=Zaker-m, OU=Mobile, O=Zaker, L=Cairo, ST=Cairo, C=EG"
          fi

          SHA256=$(keytool -list -v -keystore android/app/release.keystore -alias zakerm -storepass zakerm2026 | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "KEYSTORE_SHA256=$SHA256" >> $GITHUB_ENV
          echo "Release Keystore SHA-256: $SHA256"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Bundle (AAB) & APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: zakerm2026
          KEY_ALIAS: zakerm
          KEY_PASSWORD: zakerm2026
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Android App Bundle (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Zaker-m-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK (For Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: Zaker-m-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Zaker-m-Signing-Keystore
          path: android/app/release.keystore

      - name: Create GitHub Release with Downloads
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Zaker-m Android Release v1.0.0"
          tag_name: "v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 📱 تطبيق Zaker-m للأندرويد وجوجل بلاي

            - **ملف الرفع لجوجل بلاي (Google Play Console):** `app-release.aab`
            - **ملف التثبيت المباشر على الهاتف (APK):** `app-release.apk`
            - **شهادة التوقيع الرقمية (Keystore):** `release.keystore`
              - Alias: `zakerm`
              - Password: `zakerm2026`
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/release.keystore
